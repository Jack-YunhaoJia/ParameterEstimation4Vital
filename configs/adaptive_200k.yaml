# 自适应渲染 200k 数据生产配置
# 启用 ADSR 自适应渲染，生成 200,000 条新数据

base_config: "configs/default.yaml"

# 生产规模
production:
  target_samples: 200000
  filter_margin: 0.02
  n_presets: 34014  # ceil(200000 / 6 / (1 - 0.02))

# 采样策略（新 seed，避免与已有数据重复）
sampling:
  strategy: "lhs_stratified"
  seed: 20260320

# 多条件渲染
multi_condition:
  conditions:
    - {note: 48, velocity: 80,  duration_sec: 2.0, label: "C3_v80"}
    - {note: 48, velocity: 120, duration_sec: 2.0, label: "C3_v120"}
    - {note: 60, velocity: 80,  duration_sec: 2.0, label: "C4_v80"}
    - {note: 60, velocity: 120, duration_sec: 2.0, label: "C4_v120"}
    - {note: 72, velocity: 80,  duration_sec: 2.0, label: "C5_v80"}
    - {note: 72, velocity: 120, duration_sec: 2.0, label: "C5_v120"}

# 自适应渲染
adaptive_rendering:
  enabled: true
  sustain_margin: 0.2
  tail_margin: 0.1
  target_length_sec: null
  max_duration_sec: 30.0

# 音频预处理
preprocessing:
  silence_threshold_db: -60.0
  clipping_threshold: 0.99
  clipping_ratio_limit: 0.10
  target_peak_db: -1.0
  target_sample_rate: 16000
  tail_silence_threshold_db: -50.0
  min_duration_sec: 0.5

# 质量验证
quality:
  spectral_entropy_threshold: 0.05
  near_duplicate_threshold: 0.999
  pca_collapse_threshold: 0.95

# 并行生产（M4 Pro 优化）
parallel:
  n_workers: 11
  embedding_batch_size: 32
  embedding_device: "mps"
  checkpoint_interval: 100

# 分布分析
distribution:
  n_pca_components: 50
  diversity_threshold: 0.95
